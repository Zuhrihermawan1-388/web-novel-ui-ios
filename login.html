<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <title>Masuk — Web Novel Indie</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #eef0f4;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Container Utama */
        .container {
            position: relative;
            width: 450px;
            height: 450px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Efek Tetesan Air / Liquid Glass Utama */
        .liquid-card {
            position: absolute;
            width: 340px;
            height: 410px;
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 63% 37% 54% 46% / 55% 48% 52% 45%;
            box-shadow: 
                inset 15px 15px 25px rgba(255, 255, 255, 0.9),
                inset -15px -15px 25px rgba(180, 190, 210, 0.4),
                20px 30px 40px rgba(160, 175, 205, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 34px 40px;
            z-index: 2;
            animation: morph 8s ease-in-out infinite alternate;
        }

        @keyframes morph {
            0% {
                border-radius: 63% 37% 54% 46% / 55% 48% 52% 45%;
            }
            100% {
                border-radius: 45% 55% 42% 58% / 53% 58% 42% 47%;
            }
        }

        .liquid-card h2 {
            color: #2c3e50;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
        }
        .input-box.hide { display: none; }
        .msg {
            min-height: 18px;
            margin-top: 12px;
            font-size: 12px;
            font-weight: 600;
            text-align: center;
            color: #7f8c8d;
        }
        .msg.err { color: #e11d48; }
        .msg.ok { color: #16a34a; }
        .btn-login:disabled { opacity: .65; cursor: default; }
        @media (max-width: 440px) { .container { transform: scale(.88); } }

        /* Input Form Bergaya Neumorphic/Liquid Inset */
        .input-box {
            width: 100%;
            margin-bottom: 15px;
            position: relative;
        }

        .input-box input {
            width: 100%;
            padding: 12px 18px;
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.8);
            outline: none;
            border-radius: 30px;
            font-size: 13px;
            color: #333;
            box-shadow: inset 3px 3px 6px rgba(180, 190, 210, 0.3),
                        inset -3px -3px 6px rgba(255, 255, 255, 0.8);
        }

        .input-box input::placeholder {
            color: #95a5a6;
        }

        /* Tombol Login */
        .btn-login {
            width: 100%;
            padding: 12px;
            border: none;
            outline: none;
            background: linear-gradient(135deg, #ff2e63, #ff0055);
            color: white;
            font-weight: 600;
            font-size: 14px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(255, 0, 85, 0.3);
            transition: 0.2s ease;
            margin-top: 5px;
        }

        .btn-login:active {
            transform: scale(0.96);
        }

        /* Gelembung Samping (Sign Up & Forget Password) */
        .bubble-blue {
            position: absolute;
            right: -20px;
            top: 40px;
            width: 85px;
            height: 85px;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            border-radius: 50% 50% 40% 60% / 60% 40% 60% 40%;
            box-shadow: 
                inset 5px 5px 10px rgba(255, 255, 255, 0.6),
                10px 15px 20px rgba(0, 114, 255, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            z-index: 3;
            transition: transform 0.3s;
        }

        .bubble-purple {
            position: absolute;
            right: -40px;
            bottom: 30px;
            width: 110px;
            height: 110px;
            background: linear-gradient(135deg, #c600ff, #8a00ff);
            border-radius: 40% 60% 50% 50% / 50% 40% 60% 50%;
            box-shadow: 
                inset 6px 6px 12px rgba(255, 255, 255, 0.5),
                12px 20px 25px rgba(138, 0, 255, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 10px;
            color: white;
            font-size: 11px;
            font-weight: 600;
            line-height: 1.3;
            cursor: pointer;
            z-index: 1;
            transition: transform 0.3s;
        }

        .bubble-blue:hover, .bubble-purple:hover {
            transform: scale(1.05);
        }

        /* Judul Header Halaman */
        .page-header {
            position: absolute;
            top: 30px;
            text-align: center;
            width: 100%;
        }

        .page-header h1 {
            font-size: 26px;
            color: #2c3e50;
            font-weight: 700;
        }

        .page-header p {
            font-size: 12px;
            color: #7f8c8d;
            margin-top: 4px;
        }
    </style>
</head>
<body>

     <div class="container">
        <!-- Kartu Utama Liquid Glass -->
        <div class="liquid-card">
            <h2 id="judul">Sign in</h2>
            <form id="formAuth" autocomplete="on" style="width:100%">
                <div class="input-box">
                    <input type="text" id="inUser" placeholder="Username" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="24" required>
                </div>
                <div class="input-box">
                    <input type="password" id="inPass" placeholder="Password" autocomplete="current-password" required>
                </div>
                <div class="input-box hide" id="boxUlang">
                    <input type="password" id="inUlang" placeholder="Ulangi password" autocomplete="new-password">
                </div>
                <button type="submit" class="btn-login" id="btnAuth">LOGIN</button>
                <div class="msg" id="pesan" role="status" aria-live="polite"></div>
            </form>
        </div>

        <!-- Gelembung Biru (Sign Up) -->
        <div class="bubble-blue" id="bubSignup" role="button" tabindex="0">
            <span id="bubSignupTxt">Sign up</span>
        </div>

        <!-- Gelembung Ungu (Forget Password) -->
        <div class="bubble-purple" id="bubLupa" role="button" tabindex="0">
            Forget<br>Password
        </div>
    </div>


    <script>
        // ====== PENGATURAN (samakan dengan web utama) ======
        const SUPABASE_URL = "https://rncaoxpzxfigpjrvmykj.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_00SoqgF7YRT0V7ozV4YaFg_Wjdlch0k";
        const HALAMAN_UTAMA = "website novel.html";      // <<< GANTI dengan nama file web utamamu
        const DOMAIN_EMAIL = "wni.app";           // email internal: <username>@wni.app

        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const $ = id => document.getElementById(id);
        let modeDaftar = false;

        function pesan(teks, jenis) { const p = $('pesan'); p.textContent = teks || ''; p.className = 'msg' + (jenis ? ' ' + jenis : ''); }
        function tujuan() {
            const k = new URLSearchParams(location.search).get('kembali');
            try { if (k) { const u = new URL(k, location.href); if (u.origin === location.origin) return u.href; } } catch (e) { }
            return HALAMAN_UTAMA;
        }
        function sibuk(b) { $('btnAuth').disabled = b; }
        function setMode(daftar) {
            modeDaftar = daftar;
            $('judul').textContent = daftar ? 'Sign up' : 'Sign in';
            $('btnAuth').textContent = daftar ? 'DAFTAR' : 'LOGIN';
            $('boxUlang').classList.toggle('hide', !daftar);
            $('inUlang').required = daftar;
            $('inPass').autocomplete = daftar ? 'new-password' : 'current-password';
            $('bubSignupTxt').textContent = daftar ? 'Sign in' : 'Sign up';
            pesan('');
        }

        async function masuk(u, p) {
            // username -> email internal (username boleh diganti kapan saja)
            const { data: email, error: e1 } = await sb.rpc('login_email', { uname: u });
            if (e1) { console.warn(e1); throw new Error('Server belum siap. Pastikan supabase_tahap2.sql sudah dijalankan.'); }
            if (!email) throw new Error('Username atau password salah');
            const { error } = await sb.auth.signInWithPassword({ email: email, password: p });
            if (error) throw new Error(/invalid|credentials/i.test(error.message) ? 'Username atau password salah' : error.message);
        }
        async function daftar(u, p) {
            if (!/^[a-z0-9_]{3,24}$/.test(u)) throw new Error('Username 3–24 karakter: huruf kecil, angka, atau _');
            if (p.length < 6) throw new Error('Password minimal 6 karakter');
            if (p !== $('inUlang').value) throw new Error('Ulangi password tidak sama');
            const { data: ada } = await sb.from('profiles').select('id').ilike('username', u).limit(1);
            if (ada && ada.length) throw new Error('Username sudah dipakai');
            const { data, error } = await sb.auth.signUp({
                email: u + '@' + DOMAIN_EMAIL, password: p,
                options: { data: { username: u, display_name: u } }
            });
            if (error) throw new Error(/registered|exists/i.test(error.message) ? 'Username tidak tersedia' : error.message);
            if (!data.session) {
                // konfirmasi email masih aktif di Supabase -> coba masuk langsung
                const r = await sb.auth.signInWithPassword({ email: u + '@' + DOMAIN_EMAIL, password: p });
                if (r.error) throw new Error('Akun dibuat, tapi masih butuh konfirmasi. Matikan "Confirm email" di Supabase > Authentication > Providers > Email.');
            }
        }

        $('formAuth').addEventListener('submit', async function (e) {
            e.preventDefault();
            const u = $('inUser').value.trim().toLowerCase(), p = $('inPass').value;
            if (!u || !p) { pesan('Isi username dan password', 'err'); return; }
            sibuk(true); pesan(modeDaftar ? 'Membuat akun...' : 'Masuk...');
            try {
                if (modeDaftar) await daftar(u, p); else await masuk(u, p);
                pesan('Berhasil! Mengalihkan...', 'ok');
                setTimeout(() => { location.href = tujuan(); }, 500);
            } catch (err) { pesan(err.message || 'Terjadi kesalahan', 'err'); sibuk(false); }
        });
        function aktif(el, fn) { el.addEventListener('click', fn); el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fn(); } }); }
        aktif($('bubSignup'), () => setMode(!modeDaftar));
        aktif($('bubLupa'), () => pesan('Lupa password? Hubungi admin untuk direset.', ''));

        // sudah login? langsung ke web utama
        sb.auth.getSession().then(({ data }) => { if (data && data.session) { pesan('Sudah masuk, mengalihkan...', 'ok'); location.replace(tujuan()); } });
    </script>
</body>
</html>
